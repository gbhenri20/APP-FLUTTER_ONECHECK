name: one_check
description: Aplicativo mobile One Check — vistorias imobiliárias com Flutter + API REST.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  go_router: ^15.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  connectivity_plus: ^6.1.4
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  intl: ^0.20.2
  equatable: ^2.0.7
  collection: ^1.19.1
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.5
  build_runner: ^2.4.15
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/env/
    - assets/images/
